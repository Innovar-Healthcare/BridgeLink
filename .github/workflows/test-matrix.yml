name: Test matrix (JDK 17 / 21)

on:
  push:
    branches:
      - feature/26.6.1-clean
  pull_request:
    branches:
      - feature/26.6.1-clean

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk+fx'
          distribution: 'zulu'

      - name: Build BridgeLink (unsigned)
        working-directory: server
        run: ant -f mirth-build.xml -DdisableSigning=true

      - name: Run unit tests (all modules)
        working-directory: server
        run: ant -f mirth-build.xml test-run
