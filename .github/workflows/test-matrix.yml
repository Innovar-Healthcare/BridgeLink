# Dedicated JDK 17/21/25 test matrix (JAVA-03).
# Sibling of build_bridgelink.yml (which stays untouched, D-05) — this workflow
# runs the unsigned build + full test suite + coverage as three parallel,
# independent legs (D-07) so a failing test turns its own leg red honestly
# (Plan 16-03 wired failureproperty + <fail> into the junit targets).
name: Test matrix (JDK 17/21/25)

on:
  push:
    branches: [feature/26.9.x, feature/26.9.x-clean, bridgelink_development]
  pull_request:
    branches: [feature/26.9.x, feature/26.9.x-clean, bridgelink_development]
  schedule:
    # Nightly JDK 25 leg (IRT-1932). The 25 leg is known-red until mockito/byte-buddy
    # are bumped (pinned 5.1.1/1.14.13), so it tracks the signal without gating PRs.
    - cron: '0 6 * * *'

# Superseded pushes to the same ref stop consuming runners (IRT-1932).
# The nightly schedule gets its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: ${{ github.event_name == 'schedule' && fromJSON('["25"]') || fromJSON('["17", "21"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          java-package: 'jdk+fx'

      - name: Build Bridgelink - unsigned
        working-directory: server
        run: ant -f mirth-build.xml -DdisableSigning=true -Dskip.build.tests=true

      - name: Test + aggregate coverage
        working-directory: server
        run: ant -f mirth-build.xml test-run-and-aggregate

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            aggregate-reports/
            server/junit-reports/
            donkey/junit-reports/
