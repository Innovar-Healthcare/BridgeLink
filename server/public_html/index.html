<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta http-equiv="x-ua-compatible" content="IE=edge">
	<meta http-equiv="cache-control" content="no-cache">
	<meta http-equiv="cache-control" content="no-store">

	<title>BridgeLink</title>

	<link rel="shortcut icon" type="image/png" href="images/bridgelink-icon.png" />
	<link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
	<link rel="stylesheet" type="text/css" href="css/main.css" />

	<script type="text/javascript">
		/* Break out of frame if inside a frame. */
		if (window != window.top) {
			window.top.location = window.location;
		}
	</script>
</head>

<body id="body" class="subpage">
	<div id="centerWrapper">
		<div class="row">
			<div style="padding: 10px; text-align: center;">
				<img id="bridgeLinkLogo" src="images/bridgelink-logo.png" alt="BridgeLink" style="max-width: 100%;"/>
			</div>

			<div id="bridgelinkserver" class="span9">
				<h1 style="text-align: center;">Integration Engine Server</h1>

				<div class="help-block">
					This server has no browser-based console of its own. Channels, messages, and
					settings are administered through the BridgeLink Web Administrator, which is
					installed separately.
				</div>

				<div style="text-align: center; margin-top: 20px;">
					<a id="webAdminLink" class="btn btn-large btn-themebutton" href="https://www.bridgelink.net/web-admin/">Learn more about BridgeLink Web Admin</a>
				</div>
			</div>
		</div>
	</div>

	<footer class="smallSubPage" style="width:100%;">
		<table>
			<tr>
				<td style="text-align: center;">&copy; 2025 Innovar Healthcare | BridgeLink</td>
			</tr>
		</table>
	</footer>

	<script type="text/javascript">
		/*
		 * If an administrator has set webadmin.url in mirth.properties, point the button at this
		 * server's own Web Administrator. Otherwise the static link above is left in place, so the
		 * page still works with no configuration, a failed request, or JavaScript disabled.
		 */
		(function() {
			var link = document.getElementById('webAdminLink');

			if (!link || !window.fetch) {
				return;
			}

			fetch('webadmin-url', { headers: { 'Accept': 'application/json' } }).then(function(response) {
				return response.ok ? response.json() : null;
			}).then(function(data) {
				var url = data && data.url ? String(data.url).trim() : '';

				// Only ever navigate to an absolute http(s) URL, never to something like javascript:
				if (/^https?:\/\//i.test(url)) {
					link.href = url;
					link.textContent = 'Open BridgeLink Web Admin';
				}
			}).catch(function() {
				/* Leave the static link in place. */
			});
		})();
	</script>
</body>
</html>
